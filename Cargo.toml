[workspace]
members = [
    "figtree",
    "figtree-derive",
]
resolver = "2"

[workspace.package]
version      = "0.0.1"
edition      = "2021"
license      = "Apache 2.0"
repository   = "https://github.com/andreimerlescu/rusty-figtree"
homepage     = "https://github.com/andreimerlescu/rusty-figtree"
authors      = ["Andrei Merlescu <andrei@merlescu.net>"]

[workspace.dependencies]
syn         = { version = "2", features = ["full"] }
quote       = "1"
proc-macro2 = "1"
serde       = { version = "1", features = ["derive"] }
serde_yaml  = "0.9"
serde_json  = "1"
rust-ini    = "0.21"
clap        = { version = "4", features = ["derive", "env"] }
tokio       = { version = "1", features = ["sync"] }
thiserror   = "1"
