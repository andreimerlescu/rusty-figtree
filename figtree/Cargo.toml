[package]
name        = "figtree"
description = "A layered runtime configuration system with priority resolution, validators, callbacks, and live mutation tracking."
readme      = "README.md"
keywords    = ["config", "configuration", "runtime", "figtree", "settings"]
categories  = ["config", "data-structures"]

version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true
homepage.workspace   = true
authors.workspace    = true

[features]
default  = ["std", "env", "yaml", "json", "toml-fmt"]
std      = []
async    = ["tokio"]
cli      = ["clap"]
yaml     = ["serde", "serde_yaml"]
json     = ["serde", "serde_json"]
toml-fmt = ["serde", "toml"]
ini      = ["rust-ini"]
plist    = ["plist"]
dotenv   = ["dotenvy"]
ron      = ["ron"]
embedded = []

[dependencies]
figtree-derive = { path = "../figtree-derive", version = "0.0.1" }
thiserror      = { workspace = true }
serde          = { workspace = true, optional = true }
serde_yaml     = { workspace = true, optional = true }
serde_json     = { workspace = true, optional = true }
toml           = { workspace = true, optional = true }
rust-ini       = { workspace = true, optional = true }
plist          = { workspace = true, optional = true }
dotenvy        = { workspace = true, optional = true }
ron            = { workspace = true, optional = true }
clap           = { workspace = true, optional = true }
tokio          = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"
tokio    = { workspace = true, features = ["full"] }
